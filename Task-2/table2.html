<!DOCTYPE html>
<html>
<head>
<title>Device Table</title>
<link rel="Stylesheet" href="table2.css">
</head>
<body>
<table>
<tr>
    <th class="heading">Device</th>
    <th class="heading">Brand</th>
    <th class="heading">Specifications</th>
</tr>

<tr>
    <td>Smartphone</td>
    <td>Apple</td>
    <td>
        <table class="inner">
            <tr>
                <td class="model">Model</td>
                <td class="storage">Storage</td>
            </tr>
            <tr>
                <td>iPhone 12 Pro</td>
                <td>256GB</td>
            </tr>
            <tr>
                <td>iPhone SE</td>
                <td>128GB</td>
            </tr>
        </table>
    </td>
</tr>

<tr>
    <td>Laptop</td>
    <td>HP</td>
    <td>15.6" Display</td>
</tr>

<tr>
    <td>Tablet</td>
    <td>Samsung</td>
    <td>10.5" Display</td>
</tr>

</table>

</body>
</html>
