<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
    <link rel="stylesheet" href="lists.css">
</head>
<body>
  <h1>HTML Lists</h1> 
  <div class="container">
  <div class="card">
    <div class="header fruits">FRUITS</div>
    <ol>
      <li>Apple</li>
      <li>Mango</li>
      <li>Orange</li>
    </ol>
  </div>

  <div class="card">
    <div class="header veggies">VEGETABLES</div>
    <ul class="square-list">
      <li>Potato</li>
      <li>Tomato</li>
      <li>Onion</li>
    </ul>
  </div>

  <div class="card">
    <div class="header groceries">GROCERIES</div>
    <ul>
      <li>Rice</li>
      <li>Flour</li>
      <li>Pulses</li>
    </ul>
  </div>
</div>

</body>
</html>
